[project]
name = "concord-mcp"
version = "0.1.0"
description = "Read-only MCP server for Concord — Scripture lookup, semantic search, places, journeys, and word study as LLM tools."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kris Bennett" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.2,<2",
    "httpx>=0.27",
]

[project.scripts]
concord-mcp = "concord_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: live tests against a running Concord (CONCORD_URL); excluded by default",
]
