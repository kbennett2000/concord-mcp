[project]
name = "concord-mcp"
version = "1.0.0"
description = "Read-only MCP server for Concord — Scripture lookup, semantic search, places, journeys, and word study as LLM tools."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kris Bennett" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.2,<2",
    "httpx>=0.27",
    "bible-core",
    "bible-semantic",
]

[project.scripts]
concord-mcp = "concord_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.11",
]

# bible-core is not on PyPI, and bible-semantic's dependency on it only resolves
# inside Concord's own workspace — so both come from the same pinned Concord tag.
# The tag is the in-process *code* version; the image tag in the Makefile is the
# *data* version (ADR 0004). Bump them together, deliberately.
[tool.uv.sources]
bible-core = { git = "https://github.com/kbennett2000/concord", tag = "v1.2.0", subdirectory = "bible-core" }
bible-semantic = { git = "https://github.com/kbennett2000/concord", tag = "v1.2.0", subdirectory = "bible-semantic" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: live tests against a running Concord (CONCORD_URL); excluded by default",
]
